<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホ幅（320〜390px）表示確認用｜くらし比較ラボ</title>
<meta name="description" content="スマートフォン幅320〜390pxでの表示を確認するための一時的な確認ページです。">
<meta name="robots" content="noindex,nofollow">
<style>
  body { margin: 0; background: #e7ece9; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
  .row { display: flex; gap: 10px; padding: 8px 10px; align-items: flex-start; }
  .col { flex: none; }
  .col.w390 { width: 390px; }
  .col.w375 { width: 375px; }
  .col.w320 { width: 320px; }
  .cap { font-size: 11.5px; margin: 0 0 4px; color: #17324a; font-weight: 700; white-space: nowrap; }
  iframe { height: 900px; border: 1px solid #b9c6c1; background: #fff; display: block; }
  .w390 iframe { width: 390px; }
  .w375 iframe { width: 375px; }
  .w320 iframe { width: 320px; }
</style>
</head>
<body>
<div class="row">
  <div class="col w320"><p class="cap">320px 早見表（iPhone SE1）</p><iframe id="f320" src="categories/cashback.html" title="320 早見表"></iframe></div>
  <div class="col w375"><p class="cap">375px 早見表（iPhone SE2/3）</p><iframe id="f375" src="categories/cashback.html" title="375 早見表"></iframe></div>
  <div class="col w320"><p class="cap">320px 3行まとめ</p><iframe id="f320s" src="categories/cashback.html" title="320 まとめ"></iframe></div>
</div>
<script>
  function jumpTo(id, targetId, offset) {
    var f = document.getElementById(id);
    if (!f) return;
    f.addEventListener('load', function () {
      var w = f.contentWindow, d = w.document;
      var t = d.getElementById(targetId);
      if (!t) return;
      w.scrollTo({ top: t.getBoundingClientRect().top + w.scrollY - offset, behavior: 'instant' });
    });
  }
  jumpTo('f320', 'table', 96);
  jumpTo('f375', 'table', 96);
  jumpTo('f320s', 's3', 94);
</script>
</body>
</html>
